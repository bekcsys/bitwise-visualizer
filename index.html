<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d12">
  <title>Programs</title>
  <script>
    try {
      if (localStorage.getItem("viz-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f4f1ea";
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div>
        <p class="kicker">Main menu</p>
        <h1>Programs</h1>
        <p class="lede">Select a program.</p>
      </div>
      <div class="segment" role="radiogroup" aria-label="Color theme">
        <button type="button" role="radio" data-theme-choice="dark" aria-checked="true">Dark</button>
        <button type="button" role="radio" data-theme-choice="light" aria-checked="false">Light</button>
      </div>
    </header>

    <nav class="menu" aria-label="Programs">
      <a class="panel menu-card" href="register.html">
        <span class="kicker">16-bit</span>
        <h2>Data register</h2>
        <p>Visualize one 16-bit register as signed, unsigned, and hexadecimal.</p>
      </a>
    </nav>
  </div>
  <script type="module" src="js/theme.js"></script>
</body>
</html>
